name: BedrockAdder
version: '${version}'
main: dev.bedrockadder.paper.BedrockAdderPlugin
api-version: '1.21.4'
description: Makes ItemsAdder content visible to Bedrock players on Geyser.
depend: [ItemsAdder]
softdepend: [Geyser-Spigot, floodgate]
commands:
  bedrockadder:
    description: Convert ItemsAdder content for Bedrock and show status.
    usage: /<command> <reload [-f]|status>
    aliases: [ba]
    permission: bedrockadder.admin
permissions:
  bedrockadder.admin:
    description: Use /bedrockadder.
    default: op
